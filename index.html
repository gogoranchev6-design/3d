<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3D Движение нагоре · Георги Ранчев</title>
<style>
:root{--acc:#bd90ef;--spiral:#a8dbd0;--bg:#0c0814;--ink:#f6f0e4;--mute:#cfc6bb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
#webgl-container{position:fixed;inset:0;z-index:1;pointer-events:none}
#track{position:relative;height:700vh;z-index:2}
#stage{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:32px;pointer-events:none}
.top, .panel-bottom, .center-box{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--spiral)}
h1{font:400 clamp(1.8rem,4vw,3rem)/1.05 Georgia,serif;margin:.2em 0 0;letter-spacing:-.02em}
h1 em{color:var(--acc);font-style:italic}
.nav-links{display:flex;gap:8px;flex-wrap:wrap}
.nav-links button{all:unset;cursor:pointer;font-size:.75rem;padding:6px 12px;border:1px solid #ffffff33;border-radius:99px;background:#180e23aa;backdrop-filter:blur(8px);color:var(--ink);transition:all .3s}
.nav-links button:hover,.nav-links button[aria-pressed="true"]{border-color:var(--spiral);color:var(--spiral);background:#20302daa}
.center-box{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.content-card{background:#0b0810d9;border:1px solid #ffffff1f;padding:28px 36px;border-radius:16px;backdrop-filter:blur(12px);max-width:640px;box-shadow:0 10px 40px rgba(0,0,0,0.6)}
.content-card h2{font:normal clamp(1.6rem,2.8vw,2.4rem)/1.1 Georgia,serif;color:#e9d8f6;margin:0 0 10px}
.content-card p{font-size:.95rem;color:var(--mute);margin:0;line-height:1.6}
.panel-bottom{position:absolute;bottom:24px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:flex-end;background:#0b0810e6;border:1px solid #ffffff1f;padding:14px 20px;border-radius:12px;backdrop-filter:blur(10px);gap:15px;flex-wrap:wrap}
.panel-info{font-size:.85rem;color:var(--mute);max-width:380px}
.panel-info b{display:block;color:var(--acc);font-size:.9rem;margin-bottom:3px}
.freq-selector{display:flex;gap:6px;align-items:center}
.freq-btn{all:unset;cursor:pointer;font-size:.75rem;padding:6px 10px;border:1px solid var(--spiral);border-radius:6px;color:var(--spiral);background:#180e23;transition:all .3s}
.freq-btn:hover,.freq-btn.active{background:var(--spiral);color:var(--bg)}
.prog-bar{position:absolute;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--spiral),var(--acc));width:0;z-index:20}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div class="prog-bar" id="prog"></div>
<div id="webgl-container"></div>
<div id="track">
  <div id="stage">
    <header class="top">
      <div>
        <div class="eyebrow">Спиралата на Възнесението · 3D Сцена</div>
        <h1>Движение <em>нагоре.</em></h1>
      </div>
      <nav class="nav-links" id="modeNav">
        <button type="button" data-m="0" aria-pressed="true">01 · Коши</button>
        <button type="button" data-m="1">02 · Елементи</button>
        <button type="button" data-m="2">03 · Кръст и Фуния</button>
        <button type="button" data-m="3">04 · Шестолъчна звезда</button>
        <button type="button" data-m="4">05 · Вода и Звук</button>
      </nav>
    </header>
    <div class="center-box">
      <div class="content-card">
        <h2 id="modelTitle">Кошите и Пулсиращите Обвивки</h2>
        <p id="modelDesc">Физическите, енергийни и духовни слоеве не са изолирани. Те се преливат и дишат заедно в общ поток.</p>
      </div>
    </div>
    <footer class="panel-bottom">
      <div class="panel-info">
        <b id="infoTitle">Спиралата на Възнесението</b>
        <span id="infoText">Едновременна пулсация на фините полета.</span>
      </div>
      <div class="freq-selector">
        <button type="button" class="freq-btn active" data-f="174">174 Hz</button>
        <button type="button" class="freq-btn" data-f="285">285 Hz</button>
        <button type="button" class="freq-btn" data-f="432">432 Hz</button>
        <button type="button" id="audioToggle" class="freq-btn" style="border-color:var(--acc);color:var(--acc)">Пусни звук ♫</button>
      </div>
    </footer>
  </div>
</div>
<script>
const models = [
  {title: "Кошите и Пулсиращите Обвивки", desc: "Физическите, енергийни и духовни слоеве не са изолирани. Те се преливат и дишат заедно в общ поток.", info: "Телесни обвивки и фини полета", ref: "Динамична пулсация на много нива едновременно."},
  {title: "Елементи и Сакрална Геометрия", desc: "Земята се стабилизира чрез квадрата, докато водата и огънят задават векторните посоки и чистотата на формата.", info: "Материя и базови форми", ref: "Символите и посоките изграждат физическата матрица."},
  {title: "Кръст и Аксиална Фуния", desc: "Кръстът изразява вертикалния възход към духа, докато обратната фуния укротява и насочва низходящия поток на силата.", info: "Вектори на силата и духа", ref: "Баланс между възходящия и низходящия вектум."},
  {title: "Шестолъчна Звезда (60°-60°-60°)", desc: "Преплетените триъгълници оформят матричния код. Ъглите от по 60° затварят геометрията на въглеродната основа (карбон С / 666).", info: "Карбонова матрица и код", ref: "Сакрална геометрия на материалното творение."},
  {title: "Вода, Съзнание и Честотен Панел", desc: "Кристалната структура на водата резонира с намерението и чистите акустични херци за дълбока вътрешна хармонизация.", info: "Вибрация, звук и вода", ref: "Пълен резонанс между формата и вълната."}
];
const container = document.getElementById('webgl-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 7);
const renderer = new THREE.WebGLRenderer({alpha: true, antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const pointLight = new THREE.PointLight(0xbd90ef, 2, 50);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);
const centralGroup = new THREE.Group();
scene.add(centralGroup);
const koshaGroup = new THREE.Group();
[1.2, 2.0, 2.8].forEach((r, i) => {
  const geo = new THREE.SphereGeometry(r, 32, 32);
  const mat = new THREE.MeshBasicMaterial({color: i === 0 ? 0xa8dbd0 : i === 1 ? 0xbd90ef : 0xedbb99, wireframe: true, transparent: true, opacity: 0.35 - i * 0.08});
  koshaGroup.add(new THREE.Mesh(geo, mat));
});
centralGroup.add(koshaGroup);
const elemGroup = new THREE.Group();
const earthBox = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshBasicMaterial({color: 0xedbb99, wireframe: true, transparent: true, opacity: 0.5}));
const fireTetra = new THREE.Mesh(new THREE.TetrahedronGeometry(1.8), new THREE.MeshBasicMaterial({color: 0xbd90ef, wireframe: true, transparent: true, opacity: 0.6}));
elemGroup.add(earthBox, fireTetra);
elemGroup.visible = false;
centralGroup.add(elemGroup);
const crossGroup = new THREE.Group();
const vertBar = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 3, 16), new THREE.MeshStandardMaterial({color: 0xbd90ef}));
const horizBar = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2, 16), new THREE.MeshStandardMaterial({color: 0xbd90ef}));
horizBar.rotation.z = Math.PI / 2;
const funnel = new THREE.Mesh(new THREE.ConeGeometry(1.5, 2, 16, 1, true), new THREE.MeshBasicMaterial({color: 0xa8dbd0, wireframe: true, transparent: true, opacity: 0.4}));
funnel.position.y = 1;
crossGroup.add(vertBar, horizBar, funnel);
crossGroup.visible = false;
centralGroup.add(crossGroup);
const starGroup = new THREE.Group();
const starRing = new THREE.Mesh(new THREE.TorusGeometry(1.8, 0.04, 16, 100), new THREE.MeshBasicMaterial({color: 0xa8dbd0}));
const innerStarBox = new THREE.Mesh(new THREE.OctahedronGeometry(1.5), new THREE.MeshBasicMaterial({color: 0xbd90ef, wireframe: true, transparent: true, opacity: 0.5}));
starGroup.add(starRing, innerStarBox);
starGroup.visible = false;
centralGroup.add(starGroup);
const waterGroup = new THREE.Group();
const waterMat = new THREE.MeshStandardMaterial({color: 0xa8dbd0, wireframe: true, roughness: 0.2});
waterGroup.add(new THREE.Mesh(new THREE.IcosahedronGeometry(1.8, 2), waterMat));
waterGroup.visible = false;
centralGroup.add(waterGroup);
const groups = [koshaGroup, elemGroup, crossGroup, starGroup, waterGroup];
function switchModel(idx) { groups.forEach((g, i) => { g.visible = (i === idx); }); }
let currentMode = 0;
const buttons = document.querySelectorAll('#modeNav button');
function updateContent(idx) {
  currentMode = idx;
  buttons.forEach((btn, i) => btn.setAttribute('aria-pressed', i === idx));
  document.getElementById('modelTitle').textContent = models[idx].title;
  document.getElementById('modelDesc').textContent = models[idx].desc;
  document.getElementById('infoTitle').textContent = models[idx].info;
  document.getElementById('infoText').textContent = models[idx].ref;
  switchModel(idx);
}
buttons.forEach((btn, idx) => {
  btn.addEventListener('click', () => {
    updateContent(idx);
    window.scrollTo({top: (idx / models.length) * (document.getElementById('track').offsetHeight - window.innerHeight), behavior: 'smooth'});
  });
});
window.addEventListener('scroll', () => {
  const track = document.getElementById('track');
  const prog = document.getElementById('prog');
  const max = track.offsetHeight - window.innerHeight;
  const p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
  prog.style.width = (p * 100) + '%';
  const idx = Math.min(models.length - 1, Math.floor(p * models.length));
  if (idx !== currentMode) updateContent(idx);
});
let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();
  centralGroup.rotation.y = elapsedTime * 0.15;
  centralGroup.rotation.x = Math.sin(elapsedTime * 0.1) * 0.1;
  if (koshaGroup.visible) {
    koshaGroup.children.forEach((mesh, i) => { mesh.scale.setScalar(1 + Math.sin(elapsedTime * 2 + i) * 0.05); });
  }
  if (waterGroup.visible) {
    waterGroup.rotation.z = elapsedTime * 0.1;
  }
  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
let audioCtx = null;
let osc = null;
let gainNode = null;
let currentFreq = 174;
let isPlaying = false;
const freqButtons = document.querySelectorAll('.freq-btn[data-f]');
freqButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    freqButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFreq = parseInt(btn.getAttribute('data-f'));
    if (osc && audioCtx) {
      osc.frequency.setValueAtTime(currentFreq, audioCtx.currentTime);
    }
  });
});
document.getElementById('audioToggle').addEventListener('click', async () => {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    await audioCtx.resume();
  }
  if (!isPlaying) {
    osc = audioCtx.createOscillator();
    gainNode = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(currentFreq, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(0.03, audioCtx.currentTime);
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();
    isPlaying = true;
    document.getElementById('audioToggle').textContent = 'Спри звук ■';
    document.getElementById('audioToggle').style.background = 'var(--spiral)';
    document.getElementById('audioToggle').style.color = 'var(--bg)';
  } else {
    osc.stop();
    osc.disconnect();
    isPlaying = false;
    document.getElementById('audioToggle').textContent = 'Пусни звук ♫';
    document.getElementById('audioToggle').style.background = '#180e23';
    document.getElementById('audioToggle').style.color = 'var(--acc)';
  }
});
</script>
</body>
</html>
